function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}

function ell(x,y,rx,ry,fill){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,TAU);if(fill){ctx.fillStyle=fill;ctx.fill()}}
function txt(s,x,y,size,color,align,font,bold){ctx.font=(bold?'bold ':'')+size+'px '+(font||F_KAI);ctx.fillStyle=color||'#fff';ctx.textAlign=align||'center';ctx.textBaseline='middle';ctx.fillText(s,x,y)}

function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d,type,v,dl,slide){const a=ac();if(!a||muted)return;type=type||'sine';v=v==null?.18:v;dl=dl||0;
  try{const t=a.currentTime+dl,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t+d);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.05)}catch(e){}}

function dayCfg(n){
  const pool={beggar:3,biaoshi:2};
  if(n>=2){pool.butou=1.5;pool.xiaobei=1.5;pool.xiucai=1}
  if(n>=3)pool.diaochan=1.5;
  if(n>=5)pool.qian=Math.min(2.5,.6+n*.14);
  if(n>=8)pool.zhixian=Math.min(2,.4+n*.1);
  if(n>=10)pool.pinggu=Math.min(2,.3+n*.12);
  return{
    time:120+Math.min(n,10)*6,
    tables:Math.min(5+Math.floor((n-1)/3),14),
    stoves:Math.min(2+Math.floor((n-1)/6),4),
    spawn:[Math.max(1.3,8.5-n*.26),Math.max(2.0,11.5-n*.32)],
    pool,
    story:DAY_STORIES[n]||(DAY_FLAVOR[(n-2)%DAY_FLAVOR.length]+'\n好好经营, 生意兴隆~'),
  };
}

function partyStats(){
  let wu=1,wuName='佟湘玉',wuBest=1;
  const F=[['bai','白展堂',()=>2+(upg.btrain||0)*2],['guo','郭芙蓉',()=>2+(upg.gtrain||0)*2],['wushuang','祝无双',()=>2+(upg.wtrain||0)*2],['xing','邢捕头',()=>2+(upg.etrain||0)*2],['xiaobei','莫小贝',()=>1+(upg.xtrain||0)*2]];
  for(const[k,n,f]of F)if(upg[k]>0){const v=f();wu+=v;if(v>wuBest){wuBest=v;wuName=n}}
  let wen=1+(upg.menu||0),wenName='佟湘玉';
  if(upg.xiucai>0){wen+=3+(upg.ctrain||0)*2;wenName='吕秀才'}
  const chu=2+(upg.knife||0)*2+((upg.apprentice||0)>0?2:0)+(upg.atrain||0)+((RUN&&RUN.researched)?RUN.researched.length:0);
  return{wu,wen,chu,wuName,wenName};
}
function qCap(){let s=0;for(const t of G.tables)s+=t.seats||2;return clamp(4+Math.floor(s/3),4,20)}
function resetRun(){upg={knife:0,shoes:0,deco:0,sign:0,hustle:0,bai:0,guo:0,wushuang:0,xiaobei:0,xiucai:0,xiaomi:0,box:0,menu:0,gtrain:0,btrain:0,wtrain:0,xtrain:0,ctrain:0,mtrain:0,etrain:0,atrain:0,apprentice:0,wage:0,xing:0,stove:0,hall:0,furn:0};bank=0;nextBuffs={flow:0,price:0,pat:0,tip:0};townOpts=null;nextBanquet=false;nextInjury=false}
function newGame(){resetRun();RUN={earn:0,angry:0,researched:[],fame:0,lastIncome:0};speedMul=1;startLevel(1)}
/* ============ 存档 ============ */
function saveGame(day){
  try{
    const s={v:1,day:day||G.level,upg,bank,
      run:{earn:RUN.earn,angry:RUN.angry,researched:RUN.researched,fame:RUN.fame,lastIncome:RUN.lastIncome},
      nextBuffs,nextBanquet:!!nextBanquet,nextInjury:!!nextInjury,speedMul};
    localStorage.setItem('tfkz_save',JSON.stringify(s));
  }catch(e){}
}
function loadSave(){try{return JSON.parse(localStorage.getItem('tfkz_save'))}catch(e){return null}}
function continueGame(){
  const s=loadSave();if(!s)return false;

function walk(o,dt,spd){const dx=o.tx-o.x,dy=o.ty-o.y,d=Math.hypot(dx,dy);
  if(d<4){o.moving=false;return true}
  let mv=spd*dt;
  if(d<34)mv=Math.min(d,spd*dt*(.3+.7*d/34)); // 到站减速, 告别急停
  mv=Math.min(d,mv);o.x+=dx/d*mv;o.y+=dy/d*mv;o.moving=true;o.walkT+=mv;
  if(Math.abs(dx)>1.5)o.face=dx>0?1:-1;return false}
function custLeave(c,angry){
  if(angry){G.angry++;if(RUN)RUN.angry++;G.combo=0;sfx.angry();G.shake=Math.max(G.shake,7);

    G.oq=G.oq.filter(o=>o.cust!==c);

    const P=G.P;
    for(let i=P.carrying.length-1;i>=0;i--)if(P.carrying[i].cust===c){P.carrying.splice(i,1);addFloat(P.x,P.y-96,'白做了…','#bbb')}
    G.counter=G.counter.filter(it=>{if(it.cust===c){addFloat(counterPos(0).x,counterPos(0).y-20,'浪费了…','#aaa');return false}return true});
    if(c.table){const i=c.table.custs.indexOf(c);if(i>=0)c.table.custs.splice(i,1);c.table=null}
  }
  c.state=angry?'angry':'leaving';

}
function updCust(c,dt){
  c.pop=Math.max(0,c.pop-dt*2.5);c.idleT+=dt;
  const spdMul=(c.state==='leaving'||c.state==='angry')?1.55:(c.state==='follow'?1.4:1);
  if(c.state==='queue'){
    walk(c,dt,c.def.spd*spdMul);
    if((G.rally||0)>0)c.patience=Math.min(1,c.patience+dt*.04);
    else if(G.freeze<=0){c.patience-=dt/(30*c.def.pat*PATMUL()*1.7*(G.day.pat?1.2:1));
      if(c.patience<=0){custLeave(c,true);return}}
  }else if(c.state==='follow'){
    const e=c.escorter||G.P,ex=e.x-e.face*38,ey=e.y+6;
    if(dist(c.tx,c.ty,ex,ey)>14||!c.moving){c.tx=ex;c.ty=ey} // 去抖: 引路人没走远就不换目标
    walk(c,dt,c.def.spd*spdMul*1.6);
  }else if(c.state==='toTable'){
    if(walk(c,dt,c.def.spd*2.3)){c.state='seated';c.phase='deciding';c.decideT=2.2;c.pop=1;c.moving=false}
  }else if(c.state==='seated'){
    c.sitT=Math.min(1,(c.sitT||0)+dt*4);
    if(c.phase==='deciding'){c.decideT-=dt;if(c.decideT<=0){c.phase='order';c.patience=1;c.pop=1}}
    else if(c.phase==='order'||c.phase==='wait'){
      const fpm=Math.max.apply(null,c.order.map(k=>(DISHES[k].fx&&DISHES[k].fx.patMul)||1));
      if((G.rally||0)>0)c.patience=Math.min(1,c.patience+dt*.04);
      else if(G.freeze<=0){const base=(c.phase==='order'?22:26)*(G.day.pat?1.2:1);
        c.patience-=dt/(base*c.def.pat*PATMUL()*fpm);
        if(c.patience<=0){custLeave(c,true);return}}
    }else if(c.phase==='eat'){
      c.eatT-=dt;
      if(c.eatT<=0){
        if(c.table){c.table.money+=c.pay+c.tipPool;const i=c.table.custs.indexOf(c);if(i>=0)c.table.custs.splice(i,1)}
        if(c.key==='zhixian')unlockAch('vip');
        c.state='leaving';const dp=c.door?DOOR2:DOOR;c.tx=dp.x;c.ty=dp.y;
        addFloat(c.x,c.y-90,c.line,'#bfe3ff');heartParts(c.x,c.y-56);
      }
    }
  }else if(c.state==='leaving'||c.state==='angry'){
    if(walk(c,dt,c.def.spd*spdMul))c.dead=true;
  }
}

  for(const t of G.tables){if(t.seats<2||t.custs.length<1||t.custs.length>=t.seats)continue;const d=dist(from.x,from.y,t.x,t.y);if(d<bd){bd=d;bt=t}}return bt}
function seatDX(t){return(t.seats||2)>1?49:40} // 长凳中心: 双人凳外缘±55.5/单人±46.5, 与邻桌间距≥40
function freeSlotOf(t){ // 按槽位(0=左,1=右)找空座: 左侧客人先走时, 拼桌新客必须补左位, 而不是按人数叠到右侧
  const n=t.seats||2;
  for(let i=0;i<n;i++){if(!t.custs.some(cc=>cc.slot===i))return i}
  return -1}
function seatAt(c,t){
  if(!t)return false;
  const slot=freeSlotOf(t);
  if(slot<0)return false;
  const sdx=seatDX(t);
  c.state='toTable';c.tx=t.x+(slot===0?-sdx:sdx);c.ty=t.y+8;c.table=t;t.custs.push(c);c.patience=1;
  c.face=slot===0?1:-1;c.sitT=0;c.slot=slot;
  return true}
function actionTarget(a){const P=G.P;
  if(a.t==='seat')return{x:a.cust.x,y:a.cust.y+8};
  if(a.t==='order')return{x:a.cust.x,y:a.cust.y+42};
  if(a.t==='pick'){const i=G.counter.indexOf(a.it);const p=counterPos(Math.max(0,i));return{x:p.x,y:p.y+34}}
  if(a.t==='serve')return{x:a.cust.x,y:a.cust.y+42};
  if(a.t==='collect')return{x:a.t2.x,y:a.t2.y+46};
  return{x:P.x,y:P.y}}
function updActor(A,dt,speed){
  A.idleT+=dt;
  if((G.rally||0)>0)speed*=1.5;
  if(!A.cur&&A.queue&&A.queue.length)A.cur=A.queue.shift();
  if(A.cur){
    const a=A.cur;
    if(a.t==='seat'&&a.step===0&&!validSeat(a.cust)){A.cur=null}
    else if(a.t==='order'&&!validOrder(a.cust)){A.cur=null}
    else if(a.t==='pick'&&G.counter.indexOf(a.it)<0){A.cur=null}
    else if(a.t==='serve'&&!(a.cust.state==='seated'&&a.cust.phase==='wait')){A.cur=null}
    else if(a.t==='collect'&&!(a.t2.money>0)){A.cur=null}
    else{
      const p=actionTarget(a);A.tx=p.x;A.ty=p.y;
      if(walk(A,dt,speed)){
        const done=execAction(a,A);
        if(done!==false)A.cur=null;
        A.moving=false;
      }
    }
  }else A.moving=false;
}
function updPlayer(dt){
  const P=G.P;
  // 掌柜空闲时自动找活干, 迎宾为最低优先级兜底(与其他员工一致)
  if(!P.cur&&!P.queue.length){
    const k=pickTask(P);
    if(k)P.cur=k;
  }
  if(!P.cur&&!P.queue.length){ // 没活干: 踱回大堂待机点
    if(dist(P.x,P.y,537,551)>8){P.tx=537;P.ty=551;walk(P,dt,PSPEED());return}
    P.moving=false;return;
  }
  updActor(G.P,dt,PSPEED());
}
function execAction(a,actor){
  const A=actor||G.P;
  if(a.t==='seat'){
    const c=a.cust;
    if(!validSeat(c))return;
    const t=freeTableNear(c)||shareTableNear(c)||freeTableNear(A)||shareTableNear(A);
    if(!t){addFloat(c.x,c.y-80,'没有空桌!','#ffae42');return}
    // 引导式迎宾: 一指入座, 双人桌可拼桌
    seatAt(c,t);
    if(A.stats)A.stats.seat++;
    addFloat(t.x,t.y-64,'客官这边请~','#ffd27f');
    assignQueueTargets();
    hint('seat','客人想好后会举"!", 到时点击客人下单');
  }else if(a.t==='order'){
    const c=a.cust;if(!validOrder(c))return;
    c.phase='wait';c.patience=1;
    for(const k of c.order)G.oq.push({dish:k,cust:c});
    if(A.stats)A.stats.order++;G.rep.orders++;
    sfx.order();
    for(let j=0;j<5;j++)G.parts.push({x:c.x+rand(-7,7),y:c.y-72+rand(-6,6),vx:rand(-22,22),vy:rand(-42,-12),t:0,life:.5,kind:'ink',col:'#4a4038'}); // 记单墨点
    addFloat(c.x,c.y-82,'好嘞, '+DISHES[c.order[0]].name+'~','#ffe9a8');
    if(c.order.length>1)addFloat(c.x,c.y-104,'再来一份!','#ffe9a8');
    hint('order2','李大嘴做菜中… 菜好后出现在右上出菜口');
  }else if(a.t==='pick'){
    const i=G.counter.indexOf(a.it);
    const cap=A.key?runnerCap(A):carryCap();
    if(i<0||A.carrying.length>=cap)return;
    const cp0=counterPos(i);
    // 批量取餐: 顺路把托盘装满(优先同一位客人的菜)
    const take=[a.it];G.counter.splice(i,1);
    const servable=it2=>it2.cust&&it2.cust.state==='seated'&&it2.cust.phase==='wait';
    for(let pass=0;pass<2;pass++)
      for(let j=G.counter.length-1;j>=0&&A.carrying.length+take.length<cap;j--){
        const it2=G.counter[j];
        if(servable(it2)&&(pass===1||it2.cust===a.it.cust)){
          take.push(it2);G.counter.splice(j,1);
        }
      }
    for(const it3 of take)A.carrying.push(it3);
    if(A.stats)A.stats.pick++;
    for(let fi=0;fi<Math.min(take.length,2);fi++)flyDish(cp0.x,cp0.y-8,A.x,A.y-52,take[fi].dish);
    if(take.length>1)addFloat(A.x,A.y-104,'一次端'+take.length+'盘!','#ffd27f');
    sfx.click();
    hint('carry','点击点了这道菜的客人上菜');
  }else if(a.t==='serve'){
    const c=a.cust;if(!(c.state==='seated'&&c.phase==='wait'))return;
    const idx=A.carrying.findIndex(it=>it.cust===c);
    if(idx<0)return;
    const it=A.carrying.splice(idx,1)[0],d=DISHES[it.dish];
    const i2=c.pending.indexOf(it.dish);if(i2>=0)c.pending.splice(i2,1);
    c.received.push(it.dish);
    flyDish(A.x+A.face*13,A.y-56,c.x,c.y-38,it.dish);
    if(G.t-G.lastServeT<8)G.combo++;else G.combo=1;
    if(A.stats)A.stats.serve++;
    if(G.combo>G.rep.maxCombo)G.rep.maxCombo=G.combo;
    G.lastServeT=G.t;
    const comboMul=1+.1*Math.min(G.combo-1,10);
    c.pay+=Math.round(priceOf(it.dish)*c.def.pay);
    const fx1=DISHES[it.dish].fx||{};
    c.tipPool+=Math.round(priceOf(it.dish)*.35*c.patience*c.def.pay*(1+.25*upg.sign)*comboMul*(G.buff.tip>0?2:1)*(G.buff.market>0?1.5:1)*(G.day.tip?1.15:1)*(G.runners.some(rr=>rr.key==='rxc')?1.1:1)*((upg.furn||0)>=1?1.1:1)*(fx1.tipMul||1));
    sfx.serve();G.served++;heartParts(c.x,c.y-62);
    addFloat(c.x,c.y-84,d.name+' 来喽~','#9fe3ff');
    if(G.combo>=3)addFloat(c.x,c.y-106,'连击x'+G.combo+' 🔥','#ffb347');
    if(G.combo>=5)unlockAch('combo5');
    try{const n=+(localStorage.getItem('tfkz_served')||0)+1;
      localStorage.setItem('tfkz_served',String(n));
      if(n>=50)unlockAch('dish50')}catch(e){}
    if(c.pending.length===0){c.phase='eat';
      const fem=Math.max.apply(null,c.received.map(k=>(DISHES[k].fx&&DISHES[k].fx.eatMul)||1));
      c.eatT=(4.5+2.5*c.received.length)*fem;c.eatT0=c.eatT;c.pop=1;sfx.eat();
      hint('served','上齐菜客人开吃, 吃完桌上留下银两')}
  }else if(a.t==='collect'){
    const t=a.t2;if(!(t.money>0))return;
    if(A.stats)A.stats.collect++;G.rep.collected++;
    G.income+=t.money;
    if(G.income>=300)unlockAch('endless200');
    addFloat(t.x,t.y-64,'+'+t.money+'两','#ffd24a',22);sfx.coin();coinParts(t.x,t.y-28);
    flyCoins(t.x,t.y-16,A.x,A.y-56);
    t.money=0;t.plates=[];
    hint('done','收钱啦!');
  }
}
function queueAction(a){

  if((P.cur?1:0)+P.queue.length>=4){addFloat(P.x,P.y-110,'等一下! 忙不过来啦~','#ffae42');return}

/* ============ AI跑堂(白展堂/郭芙蓉) ============ */
function runnerCap(r){return (r.key==='guo'||r.key==='wushuang'||r.key==='rxb'||r.key==='rxc'||r.key==='rxing'?1:2)+(upg.box||0)}
function claimedTask(r,task){
  const acts=[];
  const P=G.P;if(P.cur)acts.push(P.cur);for(const a of P.queue)acts.push(a);
  for(const o of G.runners)if(o!==r&&o.cur)acts.push(o.cur);
  return acts.some(a=>a.t===task.t&&(a.cust===task.cust||a.it===task.it||a.t2===task.t2));
}
function pickTask(r){ // 就近认领: 优先级不变(收钱>上菜>端菜>下单>带位), 同类活挑离自己最近的; 旧版按数组顺序常横穿全场
  const near=cs=>{let bk=null,bd=1e9;
    for(const k of cs){if(claimedTask(r,k))continue;
      const p=k.t==='pick'?counterPos(Math.max(0,G.counter.indexOf(k.it))):(k.cust||k.t2);
      const d=dist(r.x,r.y,p.x,p.y);if(d<bd){bd=d;bk=k}}
    return bk};
  const csA=[];for(const t of G.tables)if(t.money>0)csA.push({t:'collect',t2:t});
  let k=near(csA);if(k)return k;
  const csB=[];for(const it of r.carrying){const c=it.cust;
    if(c&&c.state==='seated'&&c.phase==='wait')csB.push({t:'serve',cust:c})}
  k=near(csB);if(k)return k;
  if(r.carrying.length<runnerCap(r)){
    const csC=[];for(const it of G.counter){const c=it.cust;
      if(c&&c.state==='seated'&&c.phase==='wait')csC.push({t:'pick',it})}
    k=near(csC);if(k)return k}
  const csD=[];for(const c of G.custs)if(c.state==='seated'&&c.phase==='order')csD.push({t:'order',cust:c});
  k=near(csD);if(k)return k;
  const csE=[];for(const c of G.custs)if(c.state==='queue'&&freeTableNear(c))csE.push({t:'seat',cust:c,step:0});
  k=near(csE);if(k)return k;
  return null;
}
function updRunner(r,dt){
  // 小米: 专职上街拉客, 不做店内活
  if(r.key==='xiaomi'){
    let best=null,bd=1e9;
    for(const w of G.walkers)if(w.type!=='pass'){
      const d=dist(r.x,r.y,w.x,w.y);if(d<bd){bd=d;best=w}}
    if(best&&best.x<940){
      r.tx=best.x+24;r.ty=best.y;
      walk(r,dt,r.speed*((G.rally||0)>0?1.5:1));
      if(dist(r.x,r.y,best.x,best.y)<36)lure(best,true,r);
    }else{
      if(!r.pt||walk(r,dt,r.speed*.55))r.pt={x:rand(150,850),y:650},r.tx=r.pt.x,r.ty=r.pt.y;
    }
    return;
  }
  if(!r.cur){
    r.cur=pickTask(r);
    if(!r.cur){ // 驻场待命: 在原地等下一单, 不再空跑回固定待机点(省下横穿全场的来回)
      r.moving=false;
      return;
    }
  }
  updActor(r,dt,r.speed);
}

function updatePlay(dt){
  G.t+=dt;G.shake=Math.max(0,G.shake-dt*14);G.baiCd=Math.max(0,G.baiCd-dt);
  G.freeze=Math.max(0,G.freeze-dt);G.hintT=Math.max(0,G.hintT-dt);
  G.rally=Math.max(0,G.rally-dt);G.rallyCd=Math.max(0,G.rallyCd-dt);
  if(autoSkill&&G.t>3){
    // 自动鼓舞: 店里有3位以上落座客人时
    if(G.rallyCd<=0){
      let n=0;for(const c of G.custs)if(c.state==='seated')n++;
      if(n>=3)useRally();
    }
    // 自动点穴: 有客人耐心告急(<50%)时
    if(upg.bai>0&&G.baiCd<=0){
      const danger=G.custs.some(c=>c.state==='seated'&&(c.phase==='order'||c.phase==='wait')&&c.patience<.5);
      if(danger)useBai();
    }
  }
  if((G.rushT||0)>0)G.rushT-=dt;
  if(G.rallyFx>=0){G.rallyFx+=dt/.9;if(G.rallyFx>1)G.rallyFx=-1}
  G.dazuiSay=Math.max(0,G.dazuiSay-dt);
  if(G.buff.tip>0)G.buff.tip-=dt;
  if(G.buff.cook>0)G.buff.cook-=dt;
  if(G.buff.market>0)G.buff.market-=dt;
  if(G.eventBanner&&(G.eventBanner.t-=dt)<=0)G.eventBanner=null;
  if(G.baiAnim>=0){G.baiAnim+=dt/.6;if(G.baiAnim>1)G.baiAnim=-1}
  if(pendingAch.length&&G.t>1){banner('🏅 成就解锁: '+pendingAch.shift()+'!');sfx.coin()}
  // 包席预约: 开场贵客组团上门
  if(G.banquetLeft>0){
    G.banquetT=(G.banquetT||0)-dt;
    if(G.banquetT<=0){
      if(G.banquetLeft>12){
        const vips=['qian','zhixian','pinggu'].filter(k=>G.cfg.pool[k]);
        spawnCust(vips[G.banquetLeft%vips.length]);
        addFloat(DOOR.x+120,480,'🎊 包席贵客到!','#ffd24a',20);
      }else{
        const pool=G.cfg.pool,ks=Object.keys(pool);
        spawnCust(ks[ri(0,ks.length-1)]);
      }
      G.banquetLeft--;G.banquetT=.5;
    }
  }
  if(!G.closing){
    // 小偷出没(第4天起/无尽)
    if(!G.thief&&G.thiefT!==Infinity){
      G.thiefT-=dt;
      if(G.thiefT<=0){
        const t=G.tables.find(t=>t.money>=15);
        if(t){G.thief={x:DOOR.x,y:DOOR.y,tx:t.x,ty:t.y,hp:3,state:'in',target:t,stole:0,stun:0,walkT:0,idleT:0,face:1,moving:false,baiT:upg.bai>0?3:9999};
          banner('🦹 有小偷! 快点击抓住 TA!');sfx.angry()}
        G.thiefT=rand(55,90);
      }
    }
    G.spawnT-=dt;
    let spawnGuard=0; // 高客流下允许一帧补刷多个客人
    while(G.spawnT<=0&&spawnGuard++<4){
      const qn=G.custs.filter(c=>c.state==='queue'||c.state==='follow').length;
      if(qn<qCap()){
        spawnCust();
        const ease=1/(1+Math.min((RUN.fame||0)*.02,.75));
        G.spawnT+=rand(G.cfg.spawn[0],G.cfg.spawn[1])*(qn>=qCap()-1?1.6:1)*ease/(1+.12*(upg.hustle||0))*(G.day.flow?.85:1)*((G.rushT||0)>0?.5:1);
      }else{G.spawnT=2;break}
    }
    G.timeLeft-=dt;
    if(G.timeLeft<=0){G.timeLeft=0;G.closing=true;G.closeT=0;
      addFloat(W/2,270,'打烊喽—— 最后的客人请慢用~','#ffe9a8',22)}
    // 随机事件(第2天起)
    if(G.level>=2){G.nextEventT-=dt;
      if(G.nextEventT<=0){triggerEvent();G.nextEventT=rand(45,70)}}
  }else{
    G.closeT+=dt;
    if(G.custs.length===0||G.closeT>18)return endLevel();
  }
  updKitchen(dt);
  { // 在座率采样
    let n=0;for(const t of G.tables)n+=t.custs.length;
    G.rep.seatT+=n*dt;if(n>G.rep.peak)G.rep.peak=n;
  }
  autoSeat();
  for(const c of G.custs)updCust(c,dt);
  G.custs=G.custs.filter(c=>!c.dead);
  updPlayer(dt);
  for(const r of G.runners)updRunner(r,dt);
  updThief(dt);
  updWalkers(dt);
  updFx(dt);
}

function limbIK(hx,hy,fx,fy,l1,l2,dir){ // 两段肢体IK: 髋/肩→膝/肘→脚/手
  let dx=fx-hx,dy=fy-hy,d=Math.hypot(dx,dy)||.001;const m=l1+l2-.6;
  if(d>m){dx*=m/d;dy*=m/d;d=m;fx=hx+dx;fy=hy+dy}
  const a=Math.atan2(dy,dx),ang=Math.acos(clamp((l1*l1+d*d-l2*l2)/(2*l1*d),-1,1));
  return[hx+Math.cos(a-ang*dir)*l1,hy+Math.sin(a-ang*dir)*l1,fx,fy];
}

      if(S.mood==='look')px=Math.sin((o.idleT||0)*2.4)*1.4;
      if(S.mood==='sneak')px=Math.sin(T*3)*1.6;
      ell(ex1+px*.5,hy,1.7,2.3,eyeC);ell(ex2+px*.5,hy,1.7,2.3,eyeC);
    }
    if(S.mood==='mad'){ell(f*11+2,hy-5+Math.sin(T*7)*1,1.6,2.4,'rgba(130,200,255,.85)')} // 急汗
  }
  if(!S.noMouth){
    ctx.strokeStyle='#8a4a3a';ctx.lineWidth=1.6;const mx=f*1.4;
    if(S.eatPose){ // 吃饭: 咀嚼+咬合+端碗喝汤微张
      const q=S.eatPose,chew=Math.abs(Math.sin(T*7.3));
      let h=1.2+chew*.9;
      if(q.lift>.9)h+=.9+.4*Math.sin(T*10);
      h+=q.biteOpen*2.5;
      ell(mx,hy+6,2.3,Math.min(5.4,h),'#7a3a30');
    }
    else if(S.mood==='angry')ell(mx,hy+6.4,2.6,3,'#7a3a30');
    else if(S.mood==='mad'||S.mood==='sneak'){
      ctx.beginPath();ctx.arc(mx,hy+8.4,3,Math.PI*1.15,Math.PI*1.85);ctx.stroke()}
    else if(S.mood==='meh')line(mx-2.4,hy+5.8,mx+2.4,hy+5.8);
    else{ctx.beginPath();ctx.arc(mx,hy+4.6,S.mood==='hope'?4:3.2,Math.PI*.1,Math.PI*.9);ctx.stroke()}
  }
  if(S.mustache){ // 八字胡(邢捕头)
    ctx.strokeStyle='#2e241a';ctx.lineWidth=1.8;
    ctx.beginPath();ctx.moveTo(-4.4+f*1.2,hy+3.8);ctx.quadraticCurveTo(-7.4+f*1.2,hy+5.6,-6.2+f*1.2,hy+7.6);ctx.stroke();
    ctx.beginPath();ctx.moveTo(4.4+f*1.2,hy+3.8);ctx.quadraticCurveTo(7.4+f*1.2,hy+5.6,6.2+f*1.2,hy+7.6);ctx.stroke();
  }
  if(S.sweat&&S.mood!=='mad'){ // 掌勺流汗
    ell(f*11+2,hy-5+Math.sin(T*6)*1,1.7,2.5,'rgba(130,200,255,.85)');
  }
}
function drawPerson(o,S){
  visState(o);
  const f=Math.abs(o.renFace)<.18?(o.renFace<0?-1:1)*.18:o.renFace; // 翻面过程不穿帮
  const gait=o.gait,mv=gait>.1,sit=S.sit||0;
  const ph=o.walkT*.08;
  const sc=(S.scale||1)*PSC;
  const idleB=S.cook?Math.abs(Math.sin(T*9))*1.5:Math.sin((o.idleT||0)*1.9)*1.1;
  const bob=mv?Math.abs(Math.sin(ph))*(2+1.8*gait):idleB;
  const yb=-bob;
  ctx.save();ctx.translate(o.x,o.y);ctx.scale(sc,sc);
  softShadow(0,2,S.sw||20,S.sh||7);
  ctx.translate(0,-(1-sit)*10+ease3(sit)*7); // 落座: 下沉到凳面
  if(mv)ctx.rotate(f*(.04+.07*gait)); // 移动前倾
  else if(S.cook)ctx.rotate(f*.06); // 掌勺前倾灶台
  if(sit>.5)ctx.rotate(-f*.05); // 坐姿微后仰
  ctx.lineCap='round';
  // ---- 腿(双段IK+鞋) ----
  const pants=S.pants||'#3a2c20';
  if(sit>.5){
    ctx.strokeStyle=pants;ctx.lineWidth=4.6;
    const kick=S.eat?Math.sin(T*7+(o.idleT||0))*2:0;
    // 坐姿: 大腿前伸→膝盖→小腿落地, 明确"坐在凳上"
    const k1=limbIK(-3,-11,f*8,-5,7,7,f);
    line(-3,-11,k1[0],k1[1]);ctx.lineWidth=4;line(k1[0],k1[1],k1[2],k1[3]);
    shoe(k1[2],k1[3]+1,f);
    const k2=limbIK(4,-11,f*11,-3+kick*.4,7,7,f);
    ctx.lineWidth=4.6;line(4,-11,k2[0],k2[1]);ctx.lineWidth=4;line(k2[0],k2[1],k2[2],k2[3]);
    shoe(k2[2],k2[3]+1,f);
  }else{
    const stride=(5.5+4.5*gait)*gait,lift=2.5+2.5*gait;
    for(const[hx,poff]of[[-4.5,0],[4.5,Math.PI]]){
      const p2=ph+poff;
      const fx=hx+Math.cos(p2)*stride*f,fy=-Math.max(0,Math.sin(p2))*lift;
      const k=limbIK(hx,-15+yb,fx,fy,9,9,f);
      ctx.strokeStyle=pants;ctx.lineWidth=4.6;line(hx,-15+yb,k[0],k[1]);
      ctx.lineWidth=4;line(k[0],k[1],k[2],k[3]);
      shoe(k[2],k[3],f);
    }
  }
  // ---- 袍子(下摆摆动+明暗+描边) ----
  const hem=mv?Math.sin(ph)*2*f:0,hem2=mv?Math.cos(ph)*1.2*f:0;
  ctx.beginPath();
  ctx.moveTo(-11,-46+yb);
  ctx.quadraticCurveTo(-16,-24,-14-hem,-11+yb*.4);
  ctx.quadraticCurveTo(0,-8+yb*.4-hem2*.3,14-hem,-11+yb*.4);
  ctx.quadraticCurveTo(16,-24,11,-46+yb);
  ctx.closePath();
  ctx.fillStyle=S.robe;ctx.fill();
  ctx.strokeStyle='rgba(42,24,10,.5)';ctx.lineWidth=1.3;ctx.stroke();
  ctx.save();ctx.clip();
  ctx.fillStyle='rgba(24,12,6,.15)';ctx.fillRect(f>0?1:-17,-48+yb,16,42); // 背光面
  ctx.fillStyle='rgba(255,240,210,.13)';ctx.fillRect(f>0?-17:1,-48+yb,16,26); // 受光面
  ctx.strokeStyle='rgba(30,18,8,.2)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(-4,-40+yb);ctx.quadraticCurveTo(-6.5,-28,-4.5,-14+yb);ctx.stroke();
  ctx.beginPath();ctx.moveTo(5.5,-40+yb);ctx.quadraticCurveTo(7.5,-26,5.5,-14+yb);ctx.stroke();
  ctx.fillStyle='rgba(24,12,6,.14)';ctx.fillRect(-16,-15+yb,32,6);
  if(S.apron){ctx.fillStyle=S.apron;
    ctx.beginPath();ctx.moveTo(-8,-40+yb);ctx.quadraticCurveTo(-11,-20,-9,-10+yb);
    ctx.lineTo(9,-10+yb);ctx.quadraticCurveTo(11,-20,8,-40+yb);ctx.closePath();ctx.fill();
    ctx.strokeStyle='rgba(150,140,120,.5)';ctx.lineWidth=1;
    for(let i=0;i<2;i++)line(-7,-34+i*8+yb,7,-34+i*8+yb)}
  if(S.beggar){ctx.fillStyle='#6b5a3c';ctx.fillRect(2,-38+yb,9,9);
    ctx.strokeStyle='#4a3b28';ctx.lineWidth=1;line(2,-34+yb,11,-34+yb);line(6,-38+yb,6,-29+yb)}
  ctx.restore();
  // 腰带+衣领
  ctx.fillStyle=S.belt||'rgba(30,18,8,.4)';rr(-12.5,-19.5+yb,25,4.6,2);ctx.fill();
  ell(0,-17.2+yb,1.9,1.9,S.beltK||'#ffd24a');
  ctx.strokeStyle=S.collar||'rgba(42,24,10,.45)';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(-4.5,-44+yb);ctx.lineTo(0,-36.5+yb);ctx.lineTo(4.5,-44+yb);ctx.stroke();
  if(S.fan){ // 白展堂: 腰间折扇
    ctx.save();ctx.translate(-f*10,-17+yb);ctx.rotate(-.5*f);
    ctx.strokeStyle='#e8e2d2';ctx.lineWidth=2.4;line(0,0,7,3);
    ctx.strokeStyle='#8a5a2e';ctx.lineWidth=1;line(0,1,8,4.6);
    ctx.restore();
  }
  // ---- 手臂(双段IK+手) ----
  function arm(sx,txA,tyA){
    const k=limbIK(sx,-38+yb,txA,tyA,8,8,-f);
    ctx.strokeStyle=S.robe;ctx.lineWidth=5;line(sx,-38+yb,k[0],k[1]);
    ctx.lineWidth=4.2;line(k[0],k[1],k[2],k[3]);
    ell(k[2],k[3],2.1,2.1,S.skin);
    return k;
  }
  const carrying=o.carrying&&o.carrying.length;
  if(carrying){
    const tp={x:f*16,y:-37+yb*.3};
    arm(-8,tp.x-f*9,tp.y+2);arm(8,tp.x+f*9,tp.y+2);
    // 双手托盘(胸前高度)
    ell(tp.x,tp.y+5,17,4.6,'rgba(0,0,0,.16)');
    ell(tp.x,tp.y+3,17,5,'#7e5026');ell(tp.x,tp.y+1.6,15.5,4,'#a8723f');
    ctx.strokeStyle='rgba(255,235,190,.3)';ctx.lineWidth=1;
    ctx.beginPath();ctx.ellipse(tp.x,tp.y+.6,13,3,0,Math.PI*1.1,Math.PI*1.9);ctx.stroke();
    const n=o.carrying.length;
    for(let i=0;i<n;i++)drawDish(o.carrying[i].dish,tp.x-(n-1)*7+i*14,tp.y-5,.6);
  }else if(S.eat){
    const ep=eatPose(o);S.eatPose=ep;
    // ---- 后手端碗: 桌沿(f13,-24)↔嘴边(f8,-44), 举碗时低头(S.nod); 碗在头之后绘制(见 drawHead 下方) ----
    const bl=ep.lift;
    const bwx=f*(13-5*bl),bwy=-24-20*bl+yb*bl+ep.sip;
    arm(-8,bwx-f*2.6,bwy+4.4);
    S.bowlDraw={x:bwx,y:bwy,rot:f*.5*bl,steam:bl>.9?clamp((bl-.9)*9,0,1)*(.6+.4*Math.sin(T*3)):0};
    // ---- 前手筷子: 伸向桌面→夹起(dip)→收回嘴边→咬合 ----
    const hx=lerp(f*7,f*15.5,ep.tabU)-f*ep.restU*1.8;
    const hyy=lerp(-43+yb*.6,-24,ep.tabU)+ep.dip+ep.restU*10;
    const k=arm(8,hx,hyy);
    const pin=ep.dip/1.7,sdx=f*(4.6-ep.tabU*.8),sdy=lerp(-9,7.5,ep.tabU);
    ctx.strokeStyle='#8a5a2e';ctx.lineWidth=1.1; // 筷子
    line(k[2],k[3],k[2]+sdx,k[3]+sdy);
    line(k[2]+f*2.4*(1-.45*pin),k[3]+1,k[2]+sdx+f*2.4*(1-.45*pin),k[3]+sdy-1);
    if(ep.carry){ // 夹起的菜
      ell(k[2]+sdx*.62,k[3]+sdy*.62,2.3,1.6,ep.foodC);
      ell(k[2]+sdx*.62+f*.8,k[3]+sdy*.62-1,1.2,.9,'rgba(255,255,255,.35)');
    }
  }else if(sit>.5){
    const rst=Math.sin((o.idleT||0)*1.4)*1.2;
    arm(-8,f*12,-25+rst);arm(8,f*8,-28-rst);
  }else{
    const asw=mv?Math.sin(ph)*4.5*gait:0;
    arm(-8,-12+f*asw,-22+yb);arm(8,12-f*asw,-22+yb);
  }
  if(S.spatula){ // 大嘴颠勺
    const a=Math.sin(T*10)*.35;
    ctx.save();ctx.translate(f*14,-30+yb*.5);ctx.rotate(-.7+a);
    ctx.strokeStyle='#5e3d22';ctx.lineWidth=2.6;line(0,0,14,0);
    ell(17,-1,4.5,3,'#3a3a3e');
    ctx.restore();
  }
  drawHead(o,S,yb,f);
  if(S.eat)eatCrumbs(S.eatPose,yb,f); // 咬合碎屑(画在头之后, 不被脸挡)
  if(S.bowlDraw){ // 端碗画在头之后: 举碗时碗沿盖住下巴/嘴, 呈喝汤状
    const b=S.bowlDraw;
    ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.rot);ctx.scale(.92,.92);
    riceBowl(1,b.steam);
    ctx.restore();
  }
  ctx.restore();
}

function custStyle(c){
  const d=c.def,sit=c.state==='seated';
  let mood='ok';
  if(c.state==='angry')mood='angry';
  else if(sit){
    if(c.phase==='eat')mood='yum';
    else if(c.phase==='order')mood='hope';
    else if(c.phase==='deciding')mood='look';
    else mood=c.patience<.35?'mad':c.patience<.65?'meh':'ok';
  }else if(c.state==='queue'&&c.patience<.35)mood='mad';
  return{robe:d.robe,skin:d.skin,hair:d.hair,deco:d.hat,beggar:c.key==='beggar',
    eyeC:c.key==='pinggu'?'#c02020':'#241a12',noMouth:c.key==='pinggu',
    sit:sit?ease3(clamp(c.sitT||0,0,1)):0,eat:sit&&c.phase==='eat',mood,
    scale:c.key==='xiaobei'?.9:c.key==='qian'?.96:1};
}

function drawTable(t){
  const isHov=hover&&hover.kind==='table'&&hover.ref===t;
  const seats=t.seats||2,fancy=t.fancy;
  // 梯形台面: 前缘半宽/后缘半宽/透视深/前立面(侧沿)厚, 单人桌整体缩小
  const hwF=seats>1?33:26,hwB=seats>1?26:20,dpt=seats>1?28:23,apn=seats>1?12:10;
  const yF=t.y+dpt/2,yB=t.y-dpt/2,gw=d=>hwB+(hwF-hwB)*d/dpt;
  const trap=ins=>{const f=hwF-ins,b=hwB-ins;
    ctx.beginPath();ctx.moveTo(t.x-b+3,yB);ctx.lineTo(t.x+b-3,yB);
    ctx.quadraticCurveTo(t.x+b,yB,t.x+b,yB+2.5);ctx.lineTo(t.x+f-1,yF-2.5);
    ctx.quadraticCurveTo(t.x+f,yF,t.x+f-3,yF);ctx.lineTo(t.x-f+3,yF);
    ctx.quadraticCurveTo(t.x-f,yF,t.x-f,yF-2.5);ctx.lineTo(t.x-b+1,yB+2.5);
    ctx.quadraticCurveTo(t.x-b,yB,t.x-b+3,yB);ctx.closePath()};
  softShadow(t.x+4,yF+2,hwF+9,9);
  // 桌腿(前立面下两根可见)
  ctx.strokeStyle='#4e2f16';ctx.lineWidth=5;ctx.lineCap='round';
  line(t.x-hwF*.5,yF+3,t.x-hwF*.55,yF+18);
  line(t.x+hwF*.5,yF+3,t.x+hwF*.55,yF+18);
  // 桌裙前立面(侧沿厚)
  ctx.fillStyle=fancy?'#7a2a20':'#6b421e';
  ctx.beginPath();ctx.moveTo(t.x-hwF,yF);ctx.lineTo(t.x+hwF,yF);
  ctx.lineTo(t.x+hwF-2.5,yF+apn);ctx.lineTo(t.x-hwF+2.5,yF+apn);ctx.closePath();ctx.fill();
  ctx.strokeStyle='rgba(30,15,5,.4)';ctx.lineWidth=1;ctx.stroke();
  ctx.strokeStyle='rgba(30,15,5,.3)';
  for(let vx=t.x-hwF+13;vx<=t.x+hwF-12;vx+=13)line(vx,yF+3,vx-1.5,yF+apn-2.5);
  // 台面(梯形, 前宽后窄)
  trap(0);ctx.fillStyle=fancy?'#b8453a':'#a8723f';ctx.fill();
  ctx.strokeStyle='rgba(40,20,8,.45)';ctx.lineWidth=1;ctx.stroke();
  // 后缘受光带+前缘转折暗带
  ctx.fillStyle='rgba(255,235,190,.18)';
  ctx.beginPath();ctx.moveTo(t.x-gw(1)+2,yB+1);ctx.lineTo(t.x+gw(1)-2,yB+1);
  ctx.lineTo(t.x+gw(5)-1,yB+5);ctx.lineTo(t.x-gw(5)+1,yB+5);ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(60,32,12,.22)';
  ctx.beginPath();ctx.moveTo(t.x-gw(dpt-3)+1,yF-3);ctx.lineTo(t.x+gw(dpt-3)-1,yF-3);
  ctx.lineTo(t.x+hwF-2,yF-.5);ctx.lineTo(t.x-hwF+2,yF-.5);ctx.closePath();ctx.fill();
  // 木纹+节疤
  ctx.strokeStyle=fancy?'rgba(80,20,14,.35)':'rgba(60,32,12,.3)';ctx.lineWidth=1.2;
  line(t.x-gw(9)+3,yB+9,t.x+gw(9)-3,yB+9);
  line(t.x-gw(16)+4,yB+16,t.x+gw(16)-2,yB+16);
  line(t.x-gw(21)+2,yB+21,t.x+gw(21)*.3,yB+21);line(t.x+gw(21)*.55,yB+21,t.x+gw(21)-3,yB+21);
  ell(t.x+gw(12)*.45,yB+12,3,1.6,fancy?'rgba(80,20,14,.35)':'rgba(60,32,12,.25)');
  if(fancy){ // 金边+中央小花瓶
    ctx.strokeStyle='#ffd873';ctx.lineWidth=2;trap(2.5);ctx.stroke();
    ctx.fillStyle='#3f6e58';rr(t.x-2.4,t.y-9,4.8,8,1.6);ctx.fill();
    ell(t.x,t.y-11,3,3,'#e3543e');ell(t.x-2.8,t.y-9.4,2.2,2.2,'#c4302e');ell(t.x+2.8,t.y-9.4,2.2,2.2,'#c4302e');ell(t.x,t.y-11,1.2,1.2,'#ffd24a');
  }
  // 吃饭中的菜(随进食进度变小)
  let pl=[];for(const cu of t.custs)if(cu.state==='seated'&&cu.phase==='eat'){
    const pr=cu.eatT0?clamp(cu.eatT/cu.eatT0,0,1):1;
    for(const k of cu.received)pl.push([k,.4+.6*pr]);
  }
  const dsx=hwF*.72,dsy=yB+dpt*.36; // 菜排布随台面缩放
  for(let i=0;i<pl.length;i++)drawDish(pl[i][0],t.x-dsx+i*dsx*1.08,dsy,.62*pl[i][1]);
  // 没菜时摆茶壶茶杯(生活气)
  if(!pl.length&&!fancy){
    const px2=t.x+hwF*.5,py2=dsy;
    ctx.strokeStyle='#5c7c92';ctx.lineWidth=1.4;
    ell(px2,py2-2,4.4,3.2,'#7595a8');ell(px2,py2-4.6,2.4,1.5,'#5c7c92');ell(px2,py2-5.6,1,1,'#4a6a80');
    line(px2+4,py2-3,px2+7.5,py2-5.5);line(px2-4,py2-3,px2-6.5,py2-5.5);
    ell(px2-11,py2-.6,2.2,1.4,'#7595a8');ell(px2+11,py2-.6,2.2,1.4,'#7595a8');
  }
  // 银两
  if(t.money>0){
    const p=1+Math.sin(T*4)*.06;
    ctx.save();ctx.translate(t.x,t.y-5);ctx.scale(p,p);
    ctx.fillStyle='rgba(255,220,120,.25)';ctx.beginPath();ctx.arc(0,0,22,0,TAU);ctx.fill();
    ell(0,-3,15,6,'#e9edf4');ell(0,-8,11,4.5,'#f7f9fd');
    ctx.strokeStyle='#9aa6b8';ctx.lineWidth=1.2;
    ctx.beginPath();ctx.ellipse(0,-3,15,6,0,0,TAU);ctx.stroke();
    ctx.beginPath();ctx.ellipse(0,-8,11,4.5,0,0,TAU);ctx.stroke();
    txt('银',0,-5,9,'#5a6b85','center',F_KAI,true);
    ctx.restore();
    txt('+'+t.money,t.x,t.y-30,13,'#ffd24a','center',F_KAI,true);
  }
  if(isHov&&t.money>0){
    ctx.strokeStyle='rgba(255,220,120,.9)';ctx.lineWidth=3;
    ctx.beginPath();ctx.ellipse(t.x,t.y+4,hwF+13,27,0,0,TAU);ctx.stroke();

}

function drawBubble(c){
  const bx=c.x,by=c.y-104;
  if(c.state==='queue'){
    drawHeart5(bx,c.y-64,c.patience);
    return;
  }
  if(c.state!=='seated')return;
  drawHeart5(bx,c.y-64,c.patience);
  let content=null,w=46;
  if(c.phase==='deciding'){content='💭';w=36}
  else if(c.phase==='order'){content='!';w=34}
  else if(c.phase==='wait'){
    w=26+c.pending.length*26;
    for(let i=0;i<c.pending.length;i++){
      const dx=bx-w/2+18+i*26;
      ctx.fillStyle='rgba(255,252,240,.92)';rr(dx-12,by-10,24,22,7);ctx.fill(); // 小白底衬
      drawDish(c.pending[i],dx,by+3,.58+Math.sin(T*3+i)*.02);
    }
  }
  else if(c.phase==='eat'){content='😋';w=36}
  else if(c.phase==='pay'){content='💰';w=38}
  if(c.phase==='wait')return; // 直接画食材图标, 无需气泡底
  const sc=1+c.pop*.4;
  ctx.save();ctx.translate(bx,by);ctx.scale(sc,sc);
  ctx.fillStyle='rgba(255,252,240,.96)';rr(-w/2,-19,w,38,9);ctx.fill();
  ctx.beginPath();ctx.moveTo(-7,18);ctx.lineTo(0,30);ctx.lineTo(7,18);ctx.closePath();ctx.fill();
  if(content==='!'){
    const b=Math.abs(Math.sin(T*5))*4;
    txt('!',0,-2+b,30,'#d8302a','center',F_KAI,true);
  }else emo(content,0,-2,24);
  ctx.restore();
  if(c.phase==='pay')txt('收钱',bx,by+38,12,'#ffd24a','center',F_KAI,true);
}

let TRAVEL=null,nextInjury=false,injuryToday=false;
function tScale(){return 1+TRAVEL.loc.diff*.7}
function doTravel(key){
  const loc=LOCATIONS.find(l=>l.key===key);
  if(!loc||!G||G.level<10||G.level<loc.unlock||bank<loc.cost)return;
  bank-=loc.cost;
  (RUN.visited=RUN.visited||{})[key]=1;
  if(Object.keys(RUN.visited).length>=LOCATIONS.length)unlockAch('globetrot');
  TRAVEL={loc,startDay:G.level,dayIdx:0,cards:[],shown:0,phase:'reveal',t:0,used:{},got:{money:0,fame:0,dish:0},idle:0};
  if(G.level>=30&&RUN.lastIncome>0)TRAVEL.idle=Math.round(RUN.lastIncome*rand(.9,1.05)*loc.days);
  buildTravelDay();
  state='travel';sfx.door();
}
function buildTravelDay(){
  const loc=TRAVEL.loc,avail=EVENTS.filter(ev=>!TRAVEL.used[ev.id]&&(ev.gen||ev.loc===loc.key));
  const spec=avail.filter(ev=>ev.loc===loc.key);
  const pool=avail.slice(),cards=[];
  const n=ri(2,3);
  if(spec.length){const sp=spec[ri(0,spec.length-1)];pool.splice(pool.indexOf(sp),1);cards.push(sp)}
  while(cards.length<n&&pool.length)cards.push(pool.splice(ri(0,pool.length-1),1)[0]);
  if(!cards.some(c=>c.ch)){const chs=avail.filter(ev=>ev.ch&&!cards.includes(ev));
    if(chs.length)cards[cards.length-1]=chs[ri(0,chs.length-1)]}
  for(const c of cards)TRAVEL.used[c.id]=1;
  TRAVEL.cards=cards.map(ev=>({ev,revealed:false,res:null}));
  if(TRAVEL.dayIdx===loc.days-1&&TRAVEL.idle>0)
    TRAVEL.cards.push({ev:{e:'🏪',t:'店里挂机',d:'伙计们在家照常开张(按昨日速度×'+loc.days+'天)',idleCard:1},revealed:false,res:null});
  TRAVEL.shown=0;TRAVEL.phase='reveal';TRAVEL.t=0;
}
function fxApply(fx){
  const bits=[];
  if(fx.money){let v=Math.round(fx.money*tScale()+rand(-2,2));
    if(v>0){bank+=v;RUN.earn+=v;TRAVEL.got.money+=v;bits.push('+'+v+'两')}
    else{v=Math.min(bank,-v);if(v>0){bank-=v;TRAVEL.got.money-=v;bits.push('-'+v+'两')}else bits.push('身无分文')}}
  if(fx.fame){RUN.fame=(RUN.fame||0)+fx.fame;TRAVEL.got.fame+=fx.fame;bits.push('名气+'+fx.fame)}
  if(fx.dish){const left=NEW_DISH_KEYS.filter(k=>!(RUN.researched||[]).includes(k));
    if(left.length){const k=left[ri(0,left.length-1)];RUN.researched.push(k);TRAVEL.got.dish++;bits.push('新菜「'+DISHES[k].name+'」')}
    else{bank+=30;RUN.earn+=30;TRAVEL.got.money+=30;bits.push('+30两(菜谱集齐)')}}
  if(fx.btip){nextBuffs.tip=1;bits.push('明日小费+15%')}
  if(fx.bpat){nextBuffs.pat=1;bits.push('明日耐心+20%')}
  if(fx.brush){nextBuffs.rush=1;bits.push('明日开场客流x2')}
  if(fx.inj){nextInjury=true;bits.push('受伤: 明日全员速度-15%')}
  return bits.join(' ');
}
function resolveAuto(card){
  const ev=card.ev;let tot=0;for(const o of ev.auto)tot+=o[0];
  let r=Math.random()*tot,pick=ev.auto[0][1];
  for(const o of ev.auto){r-=o[0];if(r<=0){pick=o[1];break}}
  const s=fxApply(pick);
  card.res=pick.t+(s?' ['+s+']':'');
}
function chChance(opt){
  const st=partyStats();
  return clamp(st[opt.stat]/(st[opt.stat]+(TRAVEL.loc.diff+(opt.diff||0))*2),.05,.95);
}
function chooseOpt(oi){
  if(!TRAVEL||TRAVEL.phase!=='choose')return;
  const card=TRAVEL.cards[TRAVEL.shown-1];
  if(!card||!card.ev.ch||card.res)return;
  const opt=card.ev.ch[oi],st=partyStats();
  if(opt.pay!=null){
    const v=Math.min(bank,Math.round(opt.pay*tScale()));bank-=v;TRAVEL.got.money-=v;
    const extra=opt.dish?' '+fxApply({dish:1}):'';
    card.res=(opt.res||'破财免灾')+(v>0?' [-'+v+'两'+extra+']':' (好说歹说没花钱)');
  }else if(opt.skip){card.res=opt.res||'绕道而行'}
  else{
    const p=chChance(opt),who=opt.stat==='wu'?st.wuName:opt.stat==='wen'?st.wenName:'李大嘴';
    const win=Math.random()<p,out=win?opt.win:opt.lose;
    const s=fxApply(out);
    card.res=(win?'✅ ':'❌ ')+who+(win?'出手得胜! ':'落败… ')+out.t+(s?' ['+s+']':'');
    (win?sfx.coin:sfx.angry)();
  }
  TRAVEL.phase='reveal';TRAVEL.t=0;sfx.click();
}
function updTravel(dt){
  if(!TRAVEL)return;
  if(TRAVEL.phase==='reveal'){
    TRAVEL.t+=dt;
    const next=TRAVEL.cards[TRAVEL.shown];
    if(next){
      if(TRAVEL.t>=.9){
        TRAVEL.shown++;next.revealed=true;TRAVEL.t=0;sfx.click();
        if(next.ev.ch)TRAVEL.phase='choose';
        else if(!next.res){
          if(next.ev.idleCard)next.res='+'+TRAVEL.idle+' 两 (回店时入账)';
          else resolveAuto(next);
        }
      }
    }else if(TRAVEL.t>=.7)TRAVEL.phase=TRAVEL.dayIdx>=TRAVEL.loc.days-1?'done':'dayend';
  }
}
function nextTravelDay(){TRAVEL.dayIdx++;buildTravelDay()}
function endTravel(){
  if(TRAVEL.idle>0){bank+=TRAVEL.idle;RUN.earn+=TRAVEL.idle}
  G.level=TRAVEL.startDay+TRAVEL.loc.days-1;
  TRAVEL=null;state='town';sfx.gong();
  saveGame(G.level+1);
}

    if(mouse.x>=686&&mouse.x<=742&&mouse.y>=9&&mouse.y<=35){hover={kind:'btn',ref:'speed'};return}
    if(G.thief&&dist(mouse.x,mouse.y,G.thief.x,G.thief.y-30)<44){hover={kind:'thief'};return}
    for(const w of G.walkers)if(w.type!=='pass'&&dist(mouse.x,mouse.y,w.x,w.y-32)<40){hover={kind:'walker',ref:w};return}
    for(const b of frameBtns)if(mouse.x>=b.x&&mouse.x<=b.x+b.w&&mouse.y>=b.y&&mouse.y<=b.y+b.h){hover={kind:'btn',ref:b.id};return}
    if(dist(mouse.x,mouse.y,774,620)<32){hover={kind:'btn',ref:'auto'};return}
    if(dist(mouse.x,mouse.y,836,620)<42){hover={kind:'btn',ref:'rally'};return}
    if(upg.bai>0){const b=baiBtnPos();if(dist(mouse.x,mouse.y,b.x,b.y)<b.r+6){hover={kind:'btn',ref:'bai'};return}}
    for(let i=0;i<G.counter.length;i++){const p=counterPos(i);
      if(dist(mouse.x,mouse.y,p.x,p.y-8)<30){hover={kind:'dish',ref:G.counter[i]};return}}
    for(const c of G.custs){
      if(dist(mouse.x,mouse.y,c.x,c.y-40)<34){
        if(c.state==='queue'||(c.state==='seated'&&c.phase==='order')){hover={kind:'cust',ref:c};return}
        if(c.state==='seated'&&c.phase==='wait'){hover={kind:'cust',ref:c};return}
      }}
    for(const t of G.tables)if(t.money>0&&dist(mouse.x,mouse.y,t.x,t.y)<56){hover={kind:'table',ref:t};return}
  }else{
    for(const b of frameBtns)if(mouse.x>=b.x&&mouse.x<=b.x+b.w&&mouse.y>=b.y&&mouse.y<=b.y+b.h){hover={kind:'btn',ref:b.id};return}
  }
}
function playClick(p){
  const P=G.P;
  for(let i=0;i<G.counter.length;i++){const cp=counterPos(i);
    if(dist(p.x,p.y,cp.x,cp.y-8)<30){queueAction({t:'pick',it:G.counter[i]});return}}
  for(const c of G.custs){
    if(dist(p.x,p.y,c.x,c.y-40)<34){
      if(c.state==='queue'){queueAction({t:'seat',cust:c,step:0});return}
      if(c.state==='seated'&&c.phase==='order'){queueAction({t:'order',cust:c});return}
      if(c.state==='seated'&&c.phase==='wait'){
        if(P.carrying.some(it=>it.cust===c)||P.queue.some(a=>a.t==='pick'&&a.it&&a.it.cust===c)){
          queueAction({t:'serve',cust:c});return}
        if(P.carrying.length){addFloat(c.x,c.y-98,'手上是别桌的菜~','#ffae42');return}
        addFloat(c.x,c.y-98,'菜还没做好呢~','#ffae42');return;
      }
    }
  }
  for(const t of G.tables)if(t.money>0&&dist(p.x,p.y,t.x,t.y)<56){queueAction({t:'collect',t2:t});return}
}
function onDown(p){
  if(state==='play'&&!paused){
    if(dist(p.x,p.y,774,620)<32){autoSkill=!autoSkill;sfx.click();return}
    if(dist(p.x,p.y,836,620)<42){useRally();return}
    if(upg.bai>0){const b=baiBtnPos();if(dist(p.x,p.y,b.x,b.y)<b.r+6){useBai();return}}
    if(p.x>=686&&p.x<=742&&p.y>=9&&p.y<=35){speedMul=speedMul>=5?1:speedMul+1;sfx.click();return}
    if(p.x>=771&&p.x<=809&&p.y>=6&&p.y<=38){paused=true;sfx.click();return}
    if(p.x>=823&&p.x<=861&&p.y>=6&&p.y<=38){muted=!muted;localStorage.setItem('tfkz_mute',muted?'1':'0');sfx.click();return}
    if(G.thief&&dist(p.x,p.y,G.thief.x,G.thief.y-30)<44){
      G.thief.hp--;G.thief.stun=.7;sfx.serve();
      addFloat(G.thief.x,G.thief.y-84,'打!','#ff6b5a',22);
      starParts(G.thief.x,G.thief.y-40);
      if(G.thief.hp<=0)koThief(false);
      return;
    }
    for(const w of G.walkers){
      if(dist(p.x,p.y,w.x,w.y-32)<40){
        if(w.type==='vendor')buyVendor(w);
        else if(w.type==='pass')addFloat(w.x,w.y-76,'只是路过~','#bbb');
        else lure(w,false,G.P);
        return;
      }
    }
    playClick(p);return;
  }
  for(const b of frameBtns){
    if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h&&b.cb){sfx.click();b.cb();return}
  }
}
/* ============ 主循环 ============ */
function draw(){
  frameBtns=[];
  if(state==='title')drawTitle();
  else if(state==='help')drawHelp();
  else if(state==='ach')drawAch();
  else if(state==='intro')drawIntro();
  else if(state==='play'){
    drawPlayScene();
    if(paused)drawPauseOverlay();
    else{ // 需要重画一次非暂停下的按钮命中区域由 computeHover 处理
    }
  }
  else if(state==='pass')drawPass();
  else if(state==='report')drawReport();
  else if(state==='shop')drawShop();
  else if(state==='town')drawTown();
  else if(state==='map')drawMap();
  else if(state==='travel')drawTravel();
  cv.style.cursor=hover?'pointer':'default';
}
let last=0;
function loop(ts){
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;DF=dt;
  update(dt);
  computeHover();
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
// 后台保活: 页面切走后 rAF 停转, 由定时器按真实流逝时间继续推进, 切换页面不暂停
setInterval(()=>{
  if(!document.hidden||!last)return;
  const now=performance.now(),dt=(now-last)/1000;
  if(dt>=.2){last=now;update(Math.min(dt,5))}
},200);
/* ============ 输入 ============ */
function toXY(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
cv.addEventListener('pointermove',e=>{mouse=toXY(e)});
cv.addEventListener('pointerdown',e=>{e.preventDefault();ac();const p=toXY(e);mouse=p;onDown(p)});
addEventListener('keydown',e=>{
  if(e.key==='p'||e.key==='P'||e.key==='Escape'){if(state==='play'){paused=!paused;sfx.click()}}
  if(e.key==='m'||e.key==='M'){muted=!muted;localStorage.setItem('tfkz_mute',muted?'1':'0')}
  if(e.key==='f'||e.key==='F'){if(state==='play'){speedMul=speedMul>=5?1:speedMul+1;sfx.click()}}
  if(e.key==='r'||e.key==='R'){if(state==='play'){useRally()}}
  if(e.key==='o'||e.key==='O'){autoSkill=!autoSkill;sfx.click()}
});
/* 调试/测试接口 */
window.tf={
  get state(){return state},set state(v){state=v},
  get paused(){return paused},set paused(v){paused=v},
  get speedMul(){return speedMul},set speedMul(v){speedMul=v},
  G:()=>G,RUN:()=>RUN,bank:()=>bank,upg:()=>upg,TV:()=>TRAVEL,
  inj:()=>injuryToday?1:0,nextInj:()=>nextInjury?1:0,
  setUpg(k,v){if(upg)upg[k]=v},setBank(v){bank=v},
  spawn(){if(G&&state==='play')spawnCust()},
  endNow(){if(G){G.timeLeft=Math.min(G.timeLeft,1)}},
  travel(){if(G&&(state==='intro'||state==='play'))state='map'},
  go(key){doTravel(key)},
  restart(){if(G)startLevel(G.level)},
  jump(n){resetRun();RUN={earn:0,angry:0,researched:[],fame:0,lastIncome:0};startLevel(Math.max(1,Math.min(99,n)))},
  cont(){return continueGame()},save(){saveGame()},
  hasSave(){return !!loadSave()},clearSave(){localStorage.removeItem('tfkz_save')},
  step(n,dt){for(let i=0;i<n;i++)update(dt||1/60)},
  redraw(){draw()},
};
</script>
